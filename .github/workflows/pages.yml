name: Examples site

# Publishes examples/ to GitHub Pages, so people can open the example explainers in a browser.
# To turn it on: Settings → Pages → Source: "GitHub Actions", then set the repository variable
# PAGES_ENABLED to "true" (Settings → Secrets and variables → Actions → Variables).

on:
  push:
    branches: [main]
    paths: ['examples/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples
      - id: deployment
        uses: actions/deploy-pages@v4
